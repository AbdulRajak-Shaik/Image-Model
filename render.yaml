services:
  - type: web
    name: verifakenet
    runtime: python
    region: oregon
    plan: standard          # Minimum plan needed — free tier (512MB) is too small for PyTorch
    rootDir: .
    buildCommand: pip install -r VeriFakeNet/requirements.txt
    startCommand: streamlit run VeriFakeNet/streamlit_app/app.py --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    healthCheckPath: /

    # Environment variables — set these in Render dashboard
    envVars:
      - key: GROK_API_KEY
        sync: false         # User must set this in Render dashboard
      - key: GROK_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
